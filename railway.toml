[build]
# dockerfile, а не nixpacks: nixpacks.toml переопределял только [start], а
# фазы setup/install отдавались автодетекту с незакреплённым набором
# nix-пакетов. Две сборки подряд упали за ~5 секунд на создании образа —
# то есть до pip install, ровно на этом незакреплённом шаге.
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# startCommand НЕТ намеренно — команду задаёт CMD в Dockerfile.
# Прежний startCommand содержал $PORT. При сборке через nixpacks он шёл
# через оболочку и переменная раскрывалась, а при dockerfile-сборке Railway
# запускает его как команду контейнера: $PORT остаётся литеральной строкой,
# uvicorn падает на разборе аргумента, контейнер умирает — и деплой
# проходит, а healthcheck валится. Ровно эта картина и наблюдалась.
# CMD в Dockerfile написан в форме sh -c и имеет фолбэк ${PORT:-8000}.
healthcheckPath = "/health"
# 60 с мало: старт включает init_db на сетевом томе и, если задан
# WEBSHARE_API_TOKEN, запрос за списком прокси с таймаутом до 10 с.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
