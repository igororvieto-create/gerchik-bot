[mypy]
python_version = 3.11
ignore_missing_imports = True
strict_optional = True
warn_return_any = False
no_implicit_optional = True

# Секции для exchange.bingx и strategy.strategy.gerchik удалены: этих
# модулей в проекте нет — остались от старого бота под BingX, и mypy
# молча игнорировал настройки для несуществующих путей.
[mypy-tests.*]
disallow_untyped_defs = False
